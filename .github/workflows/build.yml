name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Both loaders of every written target, plus the core's unit tests.
      - run: ./gradlew :1.21.1-fabric:build :1.21.1-neoforge:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars-and-test-reports
          path: |
            versions/*/build/libs/*.jar
            versions/*/build/reports/tests/
