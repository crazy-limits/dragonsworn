# Builds and tests every Minecraft version and loader combination when a version tag (like 0.1.0) is pushed,
# or when started by hand. Branch pushes and pull requests don't build.

name: build
on:
  push:
    # Only version tags pushed by hand; the release workflow builds the ones it creates itself
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # 1.21.x needs 21, 26.x needs 25 (which also runs Gradle).
      - name: setup jdks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build and test
        run: ./gradlew collectAll testAll --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragonsworn
          path: build/libs/
      - name: capture test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: versions/*/build/reports/tests/
