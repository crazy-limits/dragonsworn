# Checks that the commits of a pull request follow Conventional Commits, which the release workflow reads to
# pick the next version. Merge commits are skipped.

name: commits
on:
  pull_request:

jobs:
  conventional-commits:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check commit messages
        run: python3 .github/scripts/release.py lint "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
